  Build-C2-Probe-A4:            # CR10 LCD w/Probe for Aquila 427
    name: Build C2 Probe Files A4
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [427,422]
        abl: [UBL,BLT]
        inshape: [true,false]
        temp: [true,false]
        t5: [true,false]
        t13: [true,false]
        bmp: [true,false]
    steps:
    - uses: actions/checkout@v4.2.2
    - name: Set up node
      uses: actions/setup-node@v4.4.0
      with:
        node-version: 20
    - name: Cache pip
      uses: actions/cache@v4.2.3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4.2.3
      with:
