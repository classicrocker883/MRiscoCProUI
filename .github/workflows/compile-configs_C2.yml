          cp configurations/Voxelab\ Aquila\ HC32/C2/MM/Version.h Marlin/Version.h
          fi;
          sed -i "s/default_envs =.*/default_envs = HC32F460C_aquila_C2/" platformio.ini
          if ($IS); then STEMP=; else STEMP='\/\/'; fi;
          for axis in X Y Z; do
          sed -i "s/.*#define INPUT_SHAPING_${axis}/${STEMP}#define INPUT_SHAPING_${axis}/" Marlin/Configuration_adv.h
          done
          if ($TP); then PTEMP='\/\/'; MTEMP=; else PTEMP=; MTEMP='\/\/'; fi;
          sed -i "0,/^#define PIDTEMP/ s/.*#define PIDTEMP/${PTEMP}#define PIDTEMP/" Marlin/Configuration.h
          sed -i "s/.*#define MPCTEMP/${MTEMP}#define MPCTEMP/" Marlin/Configuration.h
          if ($T5); then THMP="5"; else THMP="1"; fi;
          sed -i "s/^#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 ${THMP}/" Marlin/Configuration.h
          pio run
          mkdir temp
          mv .pio/build/HC32F460C_aquila_C2/*.bin temp/build.bin
        env:
          ABL: ${{ matrix.abl }}
          IS:  ${{ matrix.inshape }}
          TP:  ${{ matrix.temp }}
          T5:  ${{ matrix.t5 }}
      - name: Get release
        id: get_release
        uses: createcandle/get-release@v1.3.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload A Release Asset
        uses: classicrocker883/upload-a-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: temp/build.bin
          asset_name: ${{ steps.build_configs.outputs.filename }}
          asset_content_type: application/x-binary
  Build-C2-Default-MM-A4:            # CR10 LCD Default/MM for Aquila 427
    name: Build C2 Default/MM Files A4
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip:    [427,422]
        abl:     [MM,Default]
        inshape: [true,false]
        temp:    [true,false]
        t5:      [true,false]
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Select Python 3.13
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip wheel platformio
      - name: Run PlatformIO
        id: build_configs
        run: |
          if [ "$AQUILA_VER" = 427 ]; then AVTMP=_427; DBORD='CREALITY_V427'; else AVTMP=_422; DBORD='CREALITY_V422'; fi;
          if ($IS); then ISTMP=-IS;   else ISTMP=; fi;
          if ($TP); then TPTMP=-MPC;  else TPTMP=; fi;
          if ($T5); then STMP=_SPDY5; else STMP=;  fi;
          echo "filename=C2${AVTMP}${STMP}_${ABL}${ISTMP}${TPTMP}$(date +"-%m-%d").bin" >> $GITHUB_OUTPUT
          > Marlin/Configuration.h
          > Marlin/Configuration_adv.h
          > Marlin/Version.h
          if [ "$ABL" = Default ]; then
          cp configurations/Voxelab\ Aquila\ 427/Default/Configuration.h Marlin/Configuration.h
          cp configurations/Voxelab\ Aquila\ 427/Default/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/Voxelab\ Aquila\ 427/Default/Version.h Marlin/Version.h
          elif [ "$ABL" = MM ]; then
          cp configurations/Voxelab\ Aquila\ 427/MM/Configuration.h Marlin/Configuration.h
          cp configurations/Voxelab\ Aquila\ 427/MM/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/Voxelab\ Aquila\ 427/MM/Version.h Marlin/Version.h
          fi;
          sed -i "s/default_envs =.*/default_envs = STM32F103RE_creality/" platformio.ini
          sed -i "s/.*#define MOTHERBOARD BOARD_.*/#define MOTHERBOARD BOARD_${DBORD}/" Marlin/Configuration.h
          sed -i "s/.*#define REVERSE_ENCODER_DIRECTION/\/\/#define REVERSE_ENCODER_DIRECTION/" Marlin/Configuration.h
          sed -i "s/.*#define DWIN_LCD_PROUI/\/\/#define DWIN_LCD_PROUI/" Marlin/Configuration.h
          sed -i "s/.*#define CR10_STOCKDISPLAY/#define CR10_STOCKDISPLAY/" Marlin/Configuration.h
          sed -i "s/.*#define LCD_BACKLIGHT_TIMEOUT_MINS.*/\/\/#define LCD_BACKLIGHT_TIMEOUT_MINS/" Marlin/Configuration_adv.h
          if ($IS); then STEMP=; else STEMP='\/\/'; fi;
          for axis in X Y Z; do
          sed -i "s/.*#define INPUT_SHAPING_${axis}/${STEMP}#define INPUT_SHAPING_${axis}/" Marlin/Configuration_adv.h
          done
          if ($TP); then PTEMP='\/\/'; MTEMP=; else PTEMP=; MTEMP='\/\/'; fi;
          sed -i "0,/^#define PIDTEMP/ s/.*#define PIDTEMP/${PTEMP}#define PIDTEMP/" Marlin/Configuration.h
          sed -i "s/.*#define MPCTEMP/${MTEMP}#define MPCTEMP/" Marlin/Configuration.h
          if ($T5); then THMP="5"; else THMP="1"; fi;
          sed -i "s/^#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 ${THMP}/" Marlin/Configuration.h
          pio run
          mkdir temp
          mv .pio/build/STM32F103RE_creality/*.bin temp/build.bin
        env:
          AQUILA_VER: ${{ matrix.chip }}
          ABL: ${{ matrix.abl }}
          IS:  ${{ matrix.inshape }}
          TP:  ${{ matrix.temp }}
          T5:  ${{ matrix.t5 }}
      - name: Get release
        id: get_release
        uses: createcandle/get-release@v1.3.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload A Release Asset
        uses: classicrocker883/upload-a-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: temp/build.bin
          asset_name: ${{ steps.build_configs.outputs.filename }}
          asset_content_type: application/x-binary
  Build-C2-Probe-A4:            # CR10 LCD w/Probe for Aquila 427
    name: Build C2 Probe Files A4
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip:    [427,422]
        abl:     [UBL,BLT]
        inshape: [true,false]
        temp:    [true,false]
        t5:      [true,false]
        t13:     [true,false]
        bmp:     [true,false]
        exclude:
          - t5:  true
            t13: true
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Set up node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 20
      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v6.1.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Select Python 3.13
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip wheel platformio
      - name: Run PlatformIO
        id: build_configs
        run: |
          if [ "$AQUILA_VER" = 427 ]; then AVTMP=_427; DBORD='CREALITY_V427'; else AVTMP=_422; DBORD='CREALITY_V422'; fi;
          if ($IS);  then ISTMP=-IS;    else ISTMP=; fi;
          if ($TP);  then TPTMP=-MPC;   else TPTMP=; fi;
          if ($T5);  then STMP=_SPDY5;  else STMP=;  fi;
          if ($T13); then TTMP=_SPRT13; else TTMP=;  fi;
          if ($BMP); then MPTMP=_BMP;   else MPTMP=; fi;
          echo "filename=C2${AVTMP}${STMP}${TTMP}${MPTMP}_${ABL}${ISTMP}${TPTMP}$(date +"-%m-%d").bin" >> $GITHUB_OUTPUT
          > Marlin/Configuration.h
          > Marlin/Configuration_adv.h
          > Marlin/Version.h
          if [ "$ABL" = BLT ]; then
          cp configurations/Voxelab\ Aquila\ 427/BLT/Configuration.h Marlin/Configuration.h
          cp configurations/Voxelab\ Aquila\ 427/BLT/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/Voxelab\ Aquila\ 427/BLT/Version.h Marlin/Version.h
          elif [ "$ABL" = UBL ]; then
          cp configurations/Voxelab\ Aquila\ 427/UBL/Configuration.h Marlin/Configuration.h
          cp configurations/Voxelab\ Aquila\ 427/UBL/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/Voxelab\ Aquila\ 427/UBL/Version.h Marlin/Version.h
          sed -i "s/.*#define MESH_EDIT_GFX_OVERLAY/#define MESH_EDIT_GFX_OVERLAY/" Marlin/Configuration.h
          sed -i "s/.*#define UBL_MESH_WIZARD/#define UBL_MESH_WIZARD/" Marlin/Configuration.h
          fi;
          sed -i "s/default_envs =.*/default_envs = STM32F103RE_creality/" platformio.ini
          sed -i "s/.*#define MOTHERBOARD BOARD_.*/#define MOTHERBOARD BOARD_${DBORD}/" Marlin/Configuration.h
          if ($IS); then STEMP=; else STEMP='\/\/'; fi;
          for axis in X Y Z; do
          sed -i "s/.*#define INPUT_SHAPING_${axis}/${STEMP}#define INPUT_SHAPING_${axis}/" Marlin/Configuration_adv.h
          done
          if ($TP); then PTEMP='\/\/'; MTEMP=; else PTEMP=; MTEMP='\/\/'; fi;
          sed -i "0,/^#define PIDTEMP/ s/.*#define PIDTEMP/${PTEMP}#define PIDTEMP/" Marlin/Configuration.h
          sed -i "s/.*#define MPCTEMP/${MTEMP}#define MPCTEMP/" Marlin/Configuration.h
          case "${T5}-${T13}" in
          true-false) THMP="5";  DSMP="98"    ;;
          false-true) THMP="13"; DSMP="424.9" ;;
          *)          THMP="1";  DSMP="98"    ;;
          esac
          sed -i "s/^#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 ${THMP}/" Marlin/Configuration.h
          sed -i "s/.*#define DEFAULT_AXIS_STEPS_PER_UNIT.*/#define DEFAULT_AXIS_STEPS_PER_UNIT { 80, 80, 400, ${DSMP} }/" Marlin/Configuration.h
          if ($BMP); then
          sed -i "s/.*#define Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN/#define Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN/" Marlin/Configuration.h
          sed -i "s/.*#define Z_MIN_ENDSTOP_HIT_STATE.*/#define Z_MIN_ENDSTOP_HIT_STATE LOW/" Marlin/Configuration.h
          sed -i "s/.*#define Z_MIN_PROBE_ENDSTOP_HIT_STATE.*/#define Z_MIN_PROBE_ENDSTOP_HIT_STATE LOW/" Marlin/Configuration.h
          sed -i "s/.*#define BLTOUCH/\/\/#define BLTOUCH/" Marlin/Configuration.h
          sed -i "s/.*#define BIQU_MICROPROBE_V2/#define BIQU_MICROPROBE_V2/" Marlin/Configuration.h
          sed -i "s/.*#define PROBE_ENABLE_DISABLE/#define PROBE_ENABLE_DISABLE/" Marlin/Configuration.h
          fi;
          sed -i "s/.*#define REVERSE_ENCODER_DIRECTION/\/\/#define REVERSE_ENCODER_DIRECTION/" Marlin/Configuration.h
          sed -i "s/.*#define DWIN_LCD_PROUI/\/\/#define DWIN_LCD_PROUI/" Marlin/Configuration.h
          sed -i "s/.*#define CR10_STOCKDISPLAY/#define CR10_STOCKDISPLAY/" Marlin/Configuration.h
          sed -i "s/.*#define LCD_BACKLIGHT_TIMEOUT_MINS.*/\/\/#define LCD_BACKLIGHT_TIMEOUT_MINS/" Marlin/Configuration_adv.h
          sed -i "s/.*#define LCD_BED_TRAMMING/#define LCD_BED_TRAMMING/" Marlin/Configuration.h
          sed -i "s/.*#define ASSISTED_TRAMMING\b/#define ASSISTED_TRAMMING/" Marlin/Configuration_adv.h
          sed -i "s/.*#define ASSISTED_TRAMMING_WIZARD.*/#define ASSISTED_TRAMMING_WIZARD/" Marlin/Configuration_adv.h
          NUMBERS_ONLY=$(grep "^#define NOZZLE_TO_PROBE_OFFSET" Marlin/Configuration.h | sed -e 's/.*{//' -e 's/}.*//' | xargs)
          OFFSET_X=$(echo "$NUMBERS_ONLY" | awk -F ',' '{print $1}' | xargs)
          OFFSET_Y=$(echo "$NUMBERS_ONLY" | awk -F ',' '{print $2}' | xargs)
          NEW_TRAMMING_PTS="#define TRAMMING_POINT_XY { { 29, 29 }, { X_BED_SIZE + (${OFFSET_X}), 29 }, { X_BED_SIZE + (${OFFSET_X}), Y_BED_SIZE + (${OFFSET_Y}) }, { 29, Y_BED_SIZE + (${OFFSET_Y}) } }"
          sed -i "s/.*#define TRAMMING_POINT_XY.*/${NEW_TRAMMING_PTS}/" Marlin/Configuration_adv.h
          pio run
          mkdir temp
          mv .pio/build/STM32F103RE_creality/*.bin temp/build.bin
        env:
          AQUILA_VER: ${{ matrix.chip }}
          ABL: ${{ matrix.abl }}
          IS:  ${{ matrix.inshape }}
          TP:  ${{ matrix.temp }}
          T5:  ${{ matrix.t5 }}
          T13: ${{ matrix.t13 }}
          BMP: ${{ matrix.bmp }}
      - name: Get release
        id: get_release
        uses: createcandle/get-release@v1.3.5
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload A Release Asset
        uses: classicrocker883/upload-a-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: temp/build.bin
          asset_name: ${{ steps.build_configs.outputs.filename }}
          asset_content_type: application/x-binary
