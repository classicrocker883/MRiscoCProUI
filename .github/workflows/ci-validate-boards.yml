#
# ci-validate-boards.yml
# Validate boards.h to make sure it's all set up correctly
#

name: CI - Validate boards.h

# We can do the on: section as two items, one for pull requests and one for pushes...
on:
  pull_request:
    branches:
      - 2026-September
    paths:
      - "Marlin/src/core/boards.h"
  push:
    branches:
      - 2026-September
    paths:
      - "Marlin/src/core/boards.h"

# Cancel PR runs superseded by a new push, so stacked runs don't queue up behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate_pins_files:
    name: Validate boards.h
    if: github.repository == 'classicrocker883/MRiscoCProUI'

    runs-on: ubuntu-latest

    steps:
      - name: Check out the PR
        uses: actions/checkout@v7.0.1

      - name: Cache pip
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-validation-v1-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-validation-v1-

      - name: Select Python 3.13
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          architecture: "x64"

      - name: Validate core/boards.h
        run: |
          make validate-boards -j
