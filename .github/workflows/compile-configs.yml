        if ($T5); then THMP="5"; DSMP="98"; elif ($T13); then THMP="13"; DSMP="424.9"; elif ($S3); then THMP="61"; DSMP="388"; elif ($X3); then THMP="61"; DSMP="98"; else THMP="1"; DSMP="98"; fi;
