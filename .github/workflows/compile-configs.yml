name: Aquila Build Configs

######################### Aquila #########################

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

jobs:
  Build-UBL-EX-SKR-A:            # UBL EX for Aquila, SKR Mini
    name: Build UBL EX SKR Files A
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip:    [V3_0,V2_0,V3_0_1]
        inshape: [true,false]
        temp:    [true,false]
        tjc:     [true,false]
        t5:      [true,false]
        t13:     [true,false]
        bmp:     [true,false]
        exclude:
          - t5:      true
            t13:     true
          - chip:    V2_0
            inshape: true
          - chip:    V2_0
            temp:    true
          - chip:    V2_0
            inshape: true
            temp:    true
          - chip:    V3_0_1
            inshape: true
          - chip:    V3_0_1
            temp:    true
          - chip:    V3_0_1
            inshape: true
            temp:    true
    steps:
      - uses: actions/checkout@v6.0.0
      - name: Set up node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 20
      - name: Cache pip
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v4.3.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Select Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip wheel platformio
      - name: Run PlatformIO
        id: build_configs
        run: |
          if   [ "$SKR" = V3_0 ];   then AVTMP=-V3;     SKTMP="STM32G0B1RE"
          elif [ "$SKR" = V2_0 ];   then AVTMP=-V2;     SKTMP="STM32F103RC"
          elif [ "$SKR" = V3_0_1 ]; then AVTMP=-V3-0-1; SKTMP="STM32F401RC"
          fi;
          if ($IS);  then ISTMP=-IS;    else ISTMP=; fi;
          if ($TP);  then TPTMP=-MPC;   else TPTMP=; fi;
          if ($TJC); then DTMP=TJC-;    else DTMP=;  fi;
          if ($T5);  then STMP=_SPDY5;  else STMP=;  fi;
          if ($T13); then TTMP=_SPRT13; else TTMP=;  fi;
          if ($BMP); then MPTMP=_BMP;   else MPTMP=; fi;
          echo "filename=${DTMP}Aquila_SKR-Mini-E3${AVTMP}${TTMP}${STMP}${MPTMP}_UBL-ProUI-EX${ISTMP}${TPTMP}$(date +"-%m-%d").bin" >> $GITHUB_OUTPUT
          > Marlin/Configuration.h
          > Marlin/Configuration_adv.h
          > Marlin/Version.h
          if [ "$SKR" = V3_0 ]; then
          cp configurations/BTT_SKR-Mini-E3-V3/UBL/Configuration.h Marlin/Configuration.h
          cp configurations/BTT_SKR-Mini-E3-V3/UBL/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/BTT_SKR-Mini-E3-V3/UBL/Version.h Marlin/Version.h
          else
          cp configurations/BTT_SKR-Mini-E3-V2/UBL/Configuration.h Marlin/Configuration.h
          cp configurations/BTT_SKR-Mini-E3-V2/UBL/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/BTT_SKR-Mini-E3-V2/UBL/Version.h Marlin/Version.h
          sed -i "s/.*#define HAS_CUSTOM_COLORS 1/\/\/#define HAS_CUSTOM_COLORS 1/" Marlin/Configuration.h
          fi;
          sed -i "s/default_envs =.*/default_envs = ${SKTMP}_btt/" platformio.ini
          sed -i "s/.*#define MOTHERBOARD BOARD_.*/#define MOTHERBOARD BOARD_BTT_SKR_MINI_E3_${SKR}/" Marlin/Configuration.h
          if [ "$SKR" = V3_0_1 ]; then
          sed -i "s/.*#define CONTROLLER_FAN_PIN.*/#define CONTROLLER_FAN_PIN FAN2_PIN/" Marlin/Configuration_adv.h
          sed -i "s/.*#define E0_AUTO_FAN_PIN.*/#define E0_AUTO_FAN_PIN FAN1_PIN/" Marlin/Configuration_adv.h
          fi;
          if ($IS); then STEMP=; else STEMP='\/\/'; fi;
          for axis in X Y Z; do
          sed -i "s/.*#define INPUT_SHAPING_${axis}/${STEMP}#define INPUT_SHAPING_${axis}/" Marlin/Configuration_adv.h
          done
          if ($TP); then PTEMP='\/\/'; MTEMP=; else PTEMP=; MTEMP='\/\/'; fi;
          sed -i "0,/^#define PIDTEMP/ s/.*#define PIDTEMP/${PTEMP}#define PIDTEMP/" Marlin/Configuration.h
          sed -i "s/.*#define MPCTEMP/${MTEMP}#define MPCTEMP/" Marlin/Configuration.h
          if ($TJC); then TJEMP=; REMP='\/\/'; else TJEMP='\/\/'; REMP=; fi;
          sed -i "s/.*#define TJC_DISPLAY/${TJEMP}#define TJC_DISPLAY/" Marlin/Configuration.h
          sed -i "s/.*#define REVERSE_ENCODER_DIRECTION/${REMP}#define REVERSE_ENCODER_DIRECTION/" Marlin/Configuration.h
          case "${T5}-${T13}" in
          true-false) THMP="5";  DSMP="98"    ;;
          false-true) THMP="13"; DSMP="424.9" ;;
          *)          THMP="1";  DSMP="98"    ;;
          esac
          sed -i "s/^#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 ${THMP}/" Marlin/Configuration.h
          sed -i "s/.*#define DEFAULT_AXIS_STEPS_PER_UNIT.*/#define DEFAULT_AXIS_STEPS_PER_UNIT { 80, 80, 400, ${DSMP} }/" Marlin/Configuration.h
          if ($BMP); then
          sed -i "s/.*#define Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN/#define Z_MIN_PROBE_USES_Z_MIN_ENDSTOP_PIN/" Marlin/Configuration.h
          sed -i "s/.*#define Z_MIN_ENDSTOP_HIT_STATE.*/#define Z_MIN_ENDSTOP_HIT_STATE LOW/" Marlin/Configuration.h
          sed -i "s/.*#define Z_MIN_PROBE_ENDSTOP_HIT_STATE.*/#define Z_MIN_PROBE_ENDSTOP_HIT_STATE LOW/" Marlin/Configuration.h
          sed -i "s/.*#define BLTOUCH/\/\/#define BLTOUCH/" Marlin/Configuration.h
          sed -i "s/.*#define BIQU_MICROPROBE_V2/#define BIQU_MICROPROBE_V2/" Marlin/Configuration.h
          sed -i "s/.*#define PROBE_ENABLE_DISABLE/#define PROBE_ENABLE_DISABLE/" Marlin/Configuration.h
          fi;
          pio run
          mkdir temp
          mv .pio/build/${SKTMP}_btt/*.bin temp/build.bin
        env:
          SKR: ${{ matrix.chip }}
          IS:  ${{ matrix.inshape }}
          TP:  ${{ matrix.temp }}
          TJC: ${{ matrix.tjc }}
          T5:  ${{ matrix.t5 }}
          T13: ${{ matrix.t13 }}
          BMP: ${{ matrix.bmp }}
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload A Release Asset
        uses: classicrocker883/upload-a-release-asset@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: temp/build.bin
          asset_name: ${{ steps.build_configs.outputs.filename }}
          asset_content_type: application/x-binary
  Build-MM-EX-SKR-A:            # MM EX for Aquila, SKR Mini
    name: Build MM EX SKR Files A
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip:    [V3_0,V2_0,V3_0_1]
        inshape: [true,false]
        temp:    [true,false]
        tjc:     [true,false]
        t5:      [true,false]
        exclude:
          - chip:    V2_0
            inshape: true
          - chip:    V2_0
            temp:    true
          - chip:    V2_0
            inshape: true
            temp:    true
          - chip:    V3_0_1
            inshape: true
          - chip:    V3_0_1
            temp:    true
          - chip:    V3_0_1
            inshape: true
            temp:    true
    steps:
      - uses: actions/checkout@v6.0.0
      - name: Set up node
        uses: actions/setup-node@v6.0.0
        with:
          node-version: 20
      - name: Cache pip
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Cache PlatformIO
        uses: actions/cache@v4.3.0
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - name: Select Python 3.13
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.13"
      - name: Install PlatformIO
        run: |
          python3 -m pip install --upgrade pip wheel platformio
      - name: Run PlatformIO
        id: build_configs
        run: |
          if   [ "$SKR" = V3_0 ];   then AVTMP=-V3;     SKTMP="STM32G0B1RE"
          elif [ "$SKR" = V2_0 ];   then AVTMP=-V2;     SKTMP="STM32F103RC"
          elif [ "$SKR" = V3_0_1 ]; then AVTMP=-V3-0-1; SKTMP="STM32F401RC"
          fi;
          if ($IS);  then ISTMP=-IS;   else ISTMP=; fi;
          if ($TP);  then TPTMP=-MPC;  else TPTMP=; fi;
          if ($TJC); then DTMP=TJC-;   else DTMP=;  fi;
          if ($T5);  then STMP=_SPDY5; else STMP=;  fi;
          echo "filename=${DTMP}Aquila_SKR-Mini-E3${AVTMP}${STMP}${TTMP}_MM-ProUI-EX${ISTMP}${TPTMP}$(date +"-%m-%d").bin" >> $GITHUB_OUTPUT
          > Marlin/Configuration.h
          > Marlin/Configuration_adv.h
          > Marlin/Version.h
          if [ "$SKR" = V3_0 ]; then
          cp configurations/BTT_SKR-Mini-E3-V3/MM/Configuration.h Marlin/Configuration.h
          cp configurations/BTT_SKR-Mini-E3-V3/MM/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/BTT_SKR-Mini-E3-V3/MM/Version.h Marlin/Version.h
          else
          cp configurations/BTT_SKR-Mini-E3-V2/MM/Configuration.h Marlin/Configuration.h
          cp configurations/BTT_SKR-Mini-E3-V2/MM/Configuration_adv.h Marlin/Configuration_adv.h
          cp configurations/BTT_SKR-Mini-E3-V2/MM/Version.h Marlin/Version.h
          fi;
          sed -i "s/default_envs =.*/default_envs = ${SKTMP}_btt/" platformio.ini
          sed -i "s/.*#define MOTHERBOARD BOARD_.*/#define MOTHERBOARD BOARD_BTT_SKR_MINI_E3_${SKR}/" Marlin/Configuration.h
          if [ "$SKR" = V3_0_1 ]; then
          sed -i "s/.*#define CONTROLLER_FAN_PIN.*/#define CONTROLLER_FAN_PIN FAN2_PIN/" Marlin/Configuration_adv.h
          sed -i "s/.*#define E0_AUTO_FAN_PIN.*/#define E0_AUTO_FAN_PIN FAN1_PIN/" Marlin/Configuration_adv.h
          fi;
          if ($IS); then STEMP=; else STEMP='\/\/'; fi;
          for axis in X Y Z; do
          sed -i "s/.*#define INPUT_SHAPING_${axis}/${STEMP}#define INPUT_SHAPING_${axis}/" Marlin/Configuration_adv.h
          done
          if ($TP); then PTEMP='\/\/'; MTEMP=; else PTEMP=; MTEMP='\/\/'; fi;
          sed -i "0,/^#define PIDTEMP/ s/.*#define PIDTEMP/${PTEMP}#define PIDTEMP/" Marlin/Configuration.h
          sed -i "s/.*#define MPCTEMP/${MTEMP}#define MPCTEMP/" Marlin/Configuration.h
          if ($TJC); then TJEMP=; REMP='\/\/'; else TJEMP='\/\/'; REMP=; fi;
          sed -i "s/.*#define TJC_DISPLAY/${TJEMP}#define TJC_DISPLAY/" Marlin/Configuration.h
          sed -i "s/.*#define REVERSE_ENCODER_DIRECTION/${REMP}#define REVERSE_ENCODER_DIRECTION/" Marlin/Configuration.h
          if ($T5); then THMP="5"; else THMP="1"; fi;
          sed -i "s/^#define TEMP_SENSOR_0.*/#define TEMP_SENSOR_0 ${THMP}/" Marlin/Configuration.h
          pio run
          mkdir temp
          mv .pio/build/${SKTMP}_btt/*.bin temp/build.bin
        env:
          SKR: ${{ matrix.chip }}
          IS:  ${{ matrix.inshape }}
          TP:  ${{ matrix.temp }}
          TJC: ${{ matrix.tjc }}
          T5:  ${{ matrix.t5 }}
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.3.2
